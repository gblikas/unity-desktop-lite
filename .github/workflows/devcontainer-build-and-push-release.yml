name: devcontainer build and push release

on:
  workflow_dispatch:
    inputs:
      retag_to:
        description: "Copy a tag of the published image instead of building: the tag to create or move (2023-12 keeps a rollback point, latest rolls back)"
        default: ""
      retag_from:
        description: "The tag to copy when retag_to is set"
        default: "latest"
  pull_request:
    branches:
      - "main"
      - "staging"
  push:
    tags:
      - "v*.*.*"
    branches: 
      - "main"
      - "staging"
  

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        directory: ['unity-2022/2022.3.11f1']
        
    steps:
      - name: checkout
        id: checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: login ghcr
        id: login_ghcr
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: ${{ matrix.directory }} - copy a tag of the published image
        id: retag
        if: github.event_name == 'workflow_dispatch' && inputs.retag_to != ''
        env:
          IMAGE: ghcr.io/${{ github.repository }}/${{ matrix.directory }}
          RETAG_FROM: ${{ inputs.retag_from }}
          RETAG_TO: ${{ inputs.retag_to }}
        run: |
          # Keeps a rollback point (latest -> 2023-12) or rolls back (2023-12 -> latest) without rebuilding.
          docker buildx imagetools create --prefer-index=false --tag "${IMAGE}:${RETAG_TO}" "${IMAGE}:${RETAG_FROM}"
          from="$(docker buildx imagetools inspect "${IMAGE}:${RETAG_FROM}" --format '{{.Manifest.Digest}}')"
          to="$(docker buildx imagetools inspect "${IMAGE}:${RETAG_TO}" --format '{{.Manifest.Digest}}')"
          echo "${IMAGE}:${RETAG_FROM} is ${from}"
          echo "${IMAGE}:${RETAG_TO} is ${to}"
          [ "${from}" = "${to}" ]
      - name: ${{ matrix.directory }} - check diff changes
        id: check_diff_changes
        if: steps.retag.outcome == 'skipped'
        run: |
          if git diff --quiet HEAD^ HEAD -- ${{ matrix.directory }}; then
            echo "[${{ matrix.directory }}] didn't find changes"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "[${{ matrix.directory }}] found changes"
            echo "subfolder=${{ matrix.directory }}" >> "$GITHUB_OUTPUT"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: free disk space
        if: steps.check_diff_changes.outputs.changed == 'true'
        run: |
          # The Unity layer is about 8.7 GB uncompressed and needs roughly twice that to build and export.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker image prune --all --force
          df -h /
      - name: ${{ matrix.directory }} - prebuild unity
        id: prebuild_unity
        uses: devcontainers/ci@v0.3
        if: steps.check_diff_changes.outputs.changed == 'true'
        with:
          subfolder: ${{ steps.check_diff_changes.outputs.subfolder }}
          imageName: ghcr.io/${{ github.repository }}/${{ steps.check_diff_changes.outputs.subfolder }}
          cacheFrom: ghcr.io/${{ github.repository }}/${{ steps.check_diff_changes.outputs.subfolder }}
          refFilterForPush: "refs/heads/main"
          push: filter
